# yakey — пример для ~/.config/hypr/hyprland.conf

# держать yakey в фоне: тогда Super+Y после разблокировки не спрашивает пароль
exec-once = yakey --hidden

# блокировка экрана через logind — yakey заблокирует хранилище вместе с экраном
bind = SUPER, L, exec, loginctl lock-session
# если hyprlock запускается напрямую, сначала заблокируйте yakey:
# bind = SUPER, L, exec, yakey --lock; hyprlock

# Super+Y — окно выбора, код в буфер (очистка через 30 с)
bind = SUPER, Y, exec, yakey --pick
# Super+Shift+Y — то же, но код сразу вводится в активное окно через wtype
bind = SUPER SHIFT, Y, exec, yakey --pick --paste

# окно выбора: плавающее, по центру, поверх всего
# (синтаксис Hyprland >= 0.48; для старых версий замените windowrule на windowrulev2)
windowrule = float, title:^(yakey-pick)$
windowrule = center, title:^(yakey-pick)$
windowrule = pin, title:^(yakey-pick)$
windowrule = noanim, title:^(yakey-pick)$
