# yakey — пример для ~/.config/hypr/hypridle.conf
# yakey блокирует хранилище по сигналу logind Lock, который шлёт `loginctl lock-session`,
# и при уходе в сон. Поэтому экран лучше блокировать через loginctl, а не запуском hyprlock напрямую.

general {
    lock_cmd = pidof hyprlock || hyprlock       # выполняется по `loginctl lock-session`
    before_sleep_cmd = loginctl lock-session    # блокировать перед сном
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
